plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.stemnotes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stemnotes.app2' // nouvel identifiant : s'installe à côté de l'ancienne version, sans conflit de signature
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // Clé de signature fixe : chaque build GitHub est signé pareil, donc l'APK
    // s'installe par-dessus la version précédente sans « Application non installée ».
    signingConfigs {
        debug {
            storeFile file('stemnotes.keystore')
            storePassword 'stemnotes123'
            keyAlias 'stemnotes'
            keyPassword 'stemnotes123'
            storeType 'pkcs12'
        }
    }

    // Tout est à la racine : manifeste + fichiers .java (pas de dossier src/).
    // Les .java sont copiés dans build/generated/flatjava avant la compilation :
    // déclarer la racine comme dossier source fait entrer en conflit les tâches Gradle.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.setSrcDirs([layout.buildDirectory.dir('generated/flatjava').get().asFile])
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


def copyJavaSources = tasks.register('copyJavaSources', Copy) {
    from(projectDir) {
        include '*.java'
    }
    into layout.buildDirectory.dir('generated/flatjava')
}

tasks.withType(JavaCompile).configureEach {
    dependsOn copyJavaSources
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn copyJavaSources
}
