plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.stemnotes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stemnotes'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Tout est à la racine : manifeste + fichiers .java (pas de dossier src/)
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.filter.include('*.java')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
